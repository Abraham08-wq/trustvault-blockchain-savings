# Production setup for a cloud server with a domain name.
# Caddy obtains and renews HTTPS certificates automatically. Only ports 80 and 443 are open;
# the database, AI engine and API are reachable only inside this private Docker network.
#
# Start:  make prod-up      (requires DOMAIN and a public blockchain in .env; see README "Going online")
name: chamachain-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: chama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: chamachain
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chama -d chamachain"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build: ./ai-service
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://chama:${POSTGRES_PASSWORD}@postgres:5432/chamachain?sslmode=disable
      AI_SERVICE_URL: http://ai:8000
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. app.yourdomain.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddydata:
  caddyconfig:
